<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Platform</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        select, input { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #6366f1; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .notice { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Wallet & Withdrawals</h3>
        <p>Current Balance: <span style="color: #10b981; font-weight: bold;">$0.174</span></p>
        
        <div class="notice">
            Note: Withdrawals are processed within 24 hours max.
        </div>

        <label>Select Withdrawal Method:</label>
        <select id="method">
            <option value="bank">Bankak (Sudan Bank)</option>
            <option value="fawry">Fawry Bank</option>
            <option value="mycash">MyCash Wallet</option>
            <option value="ton">Telegram TON Wallet</option>
            <option value="binance">Binance USDT</option>
        </select>

        <label>Account / Wallet Details:</label>
        <input type="text" id="details" placeholder="Enter account number or address...">

        <label>Withdraw Amount ($):</label>
        <input type="number" id="amount" placeholder="0.00">

        <button class="btn" onclick="submitWithdraw()">Confirm Withdrawal</button>
    </div>

    <script>
        function submitWithdraw() {
            let method = document.getElementById('method').value;
            alert("Withdrawal request sent successfully via " + method + "!");
        }
    </script>
</body>
</html>
