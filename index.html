<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sudan Tap Game</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram Script -->
    <script src="https://sad.adsgram.ai/js/sad-index.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .header {
            margin-top: 10px;
        }
        .balance-container {
            font-size: 32px;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .tap-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .main-coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f59e0b, #d97706);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), inset 0 0 15px #fef08a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 4px solid #fef08a;
        }
        .main-coin:active {
            transform: scale(0.95);
        }
        .tasks-container {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .tasks-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #38bdf8;
            text-align: right;
        }
        .task-card {
            background: rgba(51, 65, 85, 0.6);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info {
            text-align: right;
        }
        .task-name {
            font-size: 14px;
            font-weight: bold;
        }
        .task-reward {
            font-size: 12px;
            color: #fbbf24;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .btn-ad {
            background: #8b5cf6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sudan Tap Game 🇸🇩</h2>
        <div class="balance-container">
            <span>🪙</span>
            <span id="balance">0</span>
        </div>
    </div>

    <div class="tap-area">
        <div class="main-coin" id="coin">🇸🇩</div>
    </div>

    <div class="tasks-container">
        <div class="tasks-title">📋 المهام والربح المضاعف</div>
        
        <div class="task-card">
            <div class="task-info">
                <div class="task-name">مشاهدة إعلان سريع</div>
                <div class="task-reward">+500 عملة 🪙</div>
            </div>
            <button class="btn btn-ad" onclick="watchAd()">شاهد الآن 📺</button>
        </div>

        <div class="task-card">
            <div class="task-info">
                <div class="task-name">الانضمام لقناة البوت</div>
                <div class="task-reward">+1000 عملة 🪙</div>
            </div>
            <button class="btn" id="task1-btn" onclick="completeTask('task1', 1000, 'https://t.me/SudanTapGame1_bot')">انضمام 📢</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('tap_balance') || '0');
        document.getElementById('balance').innerText = balance;

        const coin = document.getElementById('coin');
        coin.addEventListener('click', () => {
            balance += 1;
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('tap_balance', balance);
        });

        function completeTask(taskId, reward, url) {
            if (localStorage.getItem(taskId)) return;
            window.open(url, '_blank');
            balance += reward;
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('tap_balance', balance);
            localStorage.setItem(taskId, 'done');
            
            const btn = document.getElementById(taskId + '-btn');
            if (btn) {
                btn.innerText = 'تم ✅';
                btn.disabled = true;
            }
        }

        function watchAd() {
            const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;
            
            if (AdController) {
                AdController.show().then((result) => {
                    balance += 500;
                    document.getElementById('balance').innerText = balance;
                    localStorage.setItem('tap_balance', balance);
                    alert("مبروك! حصلت على 500 عملة لمشاهدة الإعلان 🥳");
                }).catch((result) => {
                    alert("لم يكتمل الإعلان أو لا توجد إعلانات متاحة الآن.");
                });
            } else {
                balance += 500;
                document.getElementById('balance').innerText = balance;
                localStorage.setItem('tap_balance', balance);
                alert("إعلان تجريبي: تم إضافة 500 عملة بنجاح! 🪙");
            }
        }
    </script>
</body>
</html>

<script src="https://sad.adsgram.ai/js/adsgram.min.js"></script>
